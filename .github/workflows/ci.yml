name: ci

# WHAT THIS WORKFLOW IS EVIDENCE ABOUT.
#
# Not "does graphos compile" -- the baseline job answers that in a minute. The
# question the phased jobs answer is whether the INSTALLATION is reliable: a
# machine with nothing on it, a third-party stack built from source, a package
# installed from it, and a consumer that finds that package the way a user
# would. Each phase is a separate job so a red run names its own cause:
#
#   phase 1  tpls       a third-party problem, not ours
#   phase 2  library    ours
#   phase 3  tests      a behaviour change
#   phase 4  container  the recipe works on a machine that is not this one
#
# The stack is expensive, so phase 1 caches its prefix and the later phases
# restore it. The cache key includes the build script itself: editing how the
# TPLs are built invalidates it, which is the property that keeps the cache
# from quietly testing a stack nobody builds any more.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# TPL_PREFIX is defined per job, not at workflow level.
#
# Constraint: the prefix must lie outside the checkout. CMake refuses to
# export a target whose interface include directories resolve inside the
# source tree. $RUNNER_TEMP satisfies this; the `runner` context that names
# it is in scope only in step-level expressions, and is unavailable in both
# workflow-level and job-level `env:`.
#
# Phases 1-3 therefore assign TPL_PREFIX in their first step via $GITHUB_ENV,
# which exposes it to later steps as $TPL_PREFIX and ${{ env.TPL_PREFIX }}.
# All three run on ubuntu-latest, so $RUNNER_TEMP is identical across them and
# phase 1 writes the cache at the path phases 2 and 3 restore.

jobs:
  # ---- formatting, checked and never fixed ----------------------------------
  #
  # `--dry-run --Werror` fails the run and names the file; it does not rewrite
  # anything. A job that auto-commits formatting fights every rebase and puts a
  # bot in the blame for lines it did not write, so the author runs the
  # formatter and the check only says whether they did.
  #
  # THE VERSION IS PINNED. clang-format's output changes between major
  # versions, so an unpinned formatter turns into a CI failure on the day the
  # runner image bumps -- a red build nobody caused and no diff explains.
  format:
    name: 0. format
    runs-on: ubuntu-latest
    env:
      CLANG_FORMAT_VERSION: "20"
    steps:
      - uses: actions/checkout@v4
      - name: install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-$CLANG_FORMAT_VERSION
      - name: check
        run: |
          mapfile -t files < <(find include tests apps bench python \
            \( -name '*.hpp' -o -name '*.cpp' \) 2>/dev/null | grep -vE 'build|_deps')
          echo "checking ${#files[@]} files against .clang-format"
          clang-format-$CLANG_FORMAT_VERSION --dry-run --Werror "${files[@]}"

  # ---- the dependency-free path, which must never be slow -------------------
  #
  # graphos installs with no third-party libraries at all, and that path is
  # what most users take. It is checked first, on three toolchains, and does
  # not wait for anything.
  #
  # One entry sets GRAPHOS_BUILD_PYTHON=ON. No other job in this workflow sets
  # it, so the bindings are otherwise never compiled and the python.test_graphos
  # and python.test_networkx entries never register: a regression in the binding
  # surface would not be observable in CI.
  #
  # ON for one entry rather than all three. The sanitized entry would require
  # the ASan runtime preloaded into the interpreter (LD_PRELOAD), and this job
  # is the fast path.
  baseline:
    name: baseline ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc-release
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            build_type: Release
            sanitize: ""
            python: "ON"
          - name: linux-clang-sanitize
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            build_type: Debug
            sanitize: address,undefined
            python: "OFF"
          - name: macos-release
            os: macos-latest
            cc: clang
            cxx: clang++
            build_type: Release
            sanitize: ""
            python: "OFF"
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # make UBSan findings fail the run instead of just logging
      UBSAN_OPTIONS: halt_on_error=1
      ASAN_OPTIONS: strict_string_checks=1:detect_stack_use_after_return=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        if: matrix.python == 'ON'
        with:
          python-version: "3.12"
      - name: python deps
        # numpy: required by the bindings. networkx: required by
        # python.test_networkx. Bounds match pyproject.toml.
        if: matrix.python == 'ON'
        run: python -m pip install --upgrade numpy "networkx>=3.3"
      - name: configure
        # PYTHON_EXECUTABLE is passed explicitly: pybind11 and the ctest
        # entries must resolve the interpreter installed above rather than the
        # image default.
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DGRAPHOS_SANITIZE=${{ matrix.sanitize }}
          -DGRAPHOS_BUILD_PYTHON=${{ matrix.python }}
          ${{ matrix.python == 'ON' && format('-DPYTHON_EXECUTABLE={0}', steps.py.outputs.python-path) || '' }}
      - name: build
        run: cmake --build build -j 4
      - name: test
        run: ctest --test-dir build --output-on-failure
      # ctest reports success over the C++ entries alone if the python entries
      # were never registered, so their presence is asserted explicitly.
      - name: python entries are registered
        if: matrix.python == 'ON'
        run: |
          ctest --test-dir build -N | grep -q 'python.test_graphos'
          ctest --test-dir build -N | grep -q 'python.test_networkx'
      - name: bench smoke
        run: ./build/bench/graphos_bench 8

  # ---- phase 1: the third-party stack ---------------------------------------
  tpls:
    name: 1. tpls
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: tpl prefix
        run: echo "TPL_PREFIX=$RUNNER_TEMP/tpl" >> "$GITHUB_ENV"
      - name: cache key
        id: key
        # the script is part of the key: change how the stack is built and the
        # cache is not reused, which is the whole point of caching it
        run: echo "value=tpl-ubuntu-latest-${{ hashFiles('scripts/build_tpls.sh') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: ${{ env.TPL_PREFIX }}
          key: ${{ steps.key.outputs.value }}
      - name: build the stack
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/build_tpls.sh
          JOBS=4 scripts/build_tpls.sh "$TPL_PREFIX"
      - name: what got installed
        run: ls "$TPL_PREFIX/lib/cmake"

  # ---- phase 2: the library, against that stack -----------------------------
  library:
    name: 2. library
    runs-on: ubuntu-latest
    needs: tpls
    steps:
      - uses: actions/checkout@v4
      - name: tpl prefix
        run: echo "TPL_PREFIX=$RUNNER_TEMP/tpl" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.TPL_PREFIX }}
          key: ${{ needs.tpls.outputs.key }}
          fail-on-cache-miss: true
      - name: configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install
          -DCMAKE_PREFIX_PATH=$TPL_PREFIX
          -DGRAPHOS_ENABLE_RAJA=ON
          -DGRAPHOS_ENABLE_UMPIRE=ON
          -DGRAPHOS_ENABLE_CHAI=ON
      - name: build
        run: cmake --build build -j 4
      - name: install
        run: cmake --install build
      # the build tree carries the test binaries phase 3 runs, and the install
      # tree is what phase 3 checks a consumer against
      - uses: actions/upload-artifact@v4
        with:
          name: build-tree
          path: |
            build
            install
          retention-days: 1

  # ---- phase 3: the tests, and whether the install is usable ----------------
  tests:
    name: 3. tests
    runs-on: ubuntu-latest
    needs: [tpls, library]
    steps:
      - uses: actions/checkout@v4
      - name: tpl prefix
        run: echo "TPL_PREFIX=$RUNNER_TEMP/tpl" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.TPL_PREFIX }}
          key: ${{ needs.tpls.outputs.key }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: build-tree
      - name: restore executable bits
        # artifacts do not preserve the mode bit
        run: find build -type f -exec test -s {} \; -exec chmod +x {} + || true
      - name: ctest
        run: ctest --test-dir build --output-on-failure
      - name: bench smoke
        run: ./build/bench/graphos_bench 8
      # EVERYTHING ABOVE CAN PASS WHILE THE INSTALL IS UNUSABLE: a missing
      # export, an absolute path baked into a config file, a dependency the
      # exported target does not carry. So a fresh consumer is compiled against
      # the install alone, which is the only thing a user ever sees.
      - name: a consumer finds the installed package
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(consumer LANGUAGES CXX)
          find_package(graphos CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE graphos::graphos)
          EOF
          cat > main.cpp <<'EOF'
          #include <cstdio>
          #include "graphos/graphos.hpp"
          int main() {
            graphos::Complex c(2);
            c.attach_vertices(3);
            c.attach_cell(1, {0, 1}, {-1, 1});
            std::printf("consumer: dim=%d edges=%lld\n", c.dim(), (long long)c.count(1));
            return c.count(1) == 1 ? 0 : 1;
          }
          EOF
          cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install;$TPL_PREFIX"
          cmake --build build
          ./build/consumer

  # ---- phase 4: the container -----------------------------------------------
  #
  # The Dockerfile runs the same four stages with the same scripts, from a base
  # image with nothing on it. It is the only phase that proves the recipe does
  # not depend on whatever a GitHub runner happens to have preinstalled.
  container:
    name: 4. container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build through every stage
        uses: docker/build-push-action@v6
        with:
          context: .
          target: consumer
          push: false
          load: true
          tags: graphos:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: the runtime image carries a usable install
        run: |
          docker build -t graphos:runtime .
          docker run --rm graphos:runtime \
            test -f /opt/graphos/lib/cmake/graphos/graphosConfig.cmake
          echo "runtime image exports graphosConfig.cmake"
