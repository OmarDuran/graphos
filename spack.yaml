# Spack environment for the graphos hardware-portability stack: RAJA (kernel
# execution), Umpire (memory pools), CHAI (managed arrays), pinned to the
# coordinated 2024.07 LLNL release line so the three agree on camp/BLT.
#
# Usage (details in INSTALL.md):
#   spack env activate /path/to/graphos     # this directory
#   spack install
#   cmake -S . -B build -DGRAPHOS_ENABLE_RAJA=ON -DGRAPHOS_ENABLE_UMPIRE=ON \
#         -DGRAPHOS_ENABLE_CHAI=ON -DCMAKE_PREFIX_PATH=$PWD/.spack-env/view
#
# GPU builds: add the matching variant to every spec, e.g.
#   raja@2024.07.0 +cuda cuda_arch=90   (same for umpire and chai)
# or +rocm amdgpu_target=gfx90a for AMD.
spack:
  specs:
  # +openmp on RAJA only: its for_policy becomes omp_parallel_for_exec, so
  # every kernel-form op parallelizes with zero code change. On AppleClang
  # the OpenMP runtime comes from llvm-openmp (apple-clang ships none) —
  # a dependency only RAJA's package declares, so umpire/chai stay ~openmp
  # (their variants gate internal threading the exec seams never use).
  #
  # AppleClang wrinkle: CMake's FindOpenMP reports "-Xclang -fopenmp" as a
  # single string and BLT forwards it as ONE quoted compiler argument, and
  # BLT's link flags omit libomp. Patch the INSTALLED blt's
  # cmake/thirdparty/BLTSetupOpenMP.cmake before building this line:
  #   separate_arguments(OpenMP_CXX_FLAGS UNIX_COMMAND "${OpenMP_CXX_FLAGS}")
  #   after find_package(OpenMP), and append ${OpenMP_CXX_LIBRARIES} to the
  #   default _link_flags. (Upstream: BLT flag lists vs strings.)
  # Also pre-seed OpenMP_omp_LIBRARY from CMAKE_PREFIX_PATH (NO_DEFAULT_PATH)
  # before that find_package: a stray libomp on default search paths (e.g.
  # /usr/local/bin) otherwise shadows llvm-openmp with a broken install name.
  - raja@2024.07.0+openmp
  - umpire@2024.07.0~openmp
  - chai@2024.07.0~openmp
  concretizer:
    unify: true
  view: true
  packages:
    gcc:
      externals:
      - spec: gcc@15.2.0 languages:='c,c++,fortran'
        prefix: /opt/homebrew
        extra_attributes:
          compilers:
            c: /opt/homebrew/bin/gcc-15
            cxx: /opt/homebrew/bin/g++-15
            fortran: /opt/homebrew/bin/gfortran
    apple-clang:
      externals:
      - spec: apple-clang@21.0.0
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/clang
            cxx: /usr/bin/clang++
    # +fmt_header_only exports FMT_HEADER_ONLY to consumers, inlining fmt's
    # implementation into every TU — which breaks under C++20 consteval with
    # recent AppleClang (fmt <= 11.0 is pinned by this umpire line). Linking
    # the compiled fmt avoids the broken code path entirely.
    umpire:
      require: ~fmt_header_only
    all:
      variants: ~examples ~tests
